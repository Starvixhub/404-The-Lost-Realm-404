<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | The Lost Realm</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sky">

        <div class="stars"></div>

        <div class="moon"></div>

        <div class="magic magic-1"></div>
        <div class="magic magic-2"></div>
        <div class="magic magic-3"></div>
        <div class="magic magic-4"></div>

        <main class="content">

            <section class="panel">

                <div class="rune">
                    ✦ THE LOST REALM ✦
                </div>

                <div class="error">
                    404
                </div>

                <h1>
                    The Page Has Vanished
                </h1>

                <p class="description">
                    The ancient map led us here... but the page you seek
                    has disappeared beyond the enchanted forest.
                    Perhaps the portal can guide you back to safety.
                </p>

                <button class="portal" id="homeButton">
                    ✦ Return to the Kingdom
                </button>

            </section>

        </main>

        <div class="castle"></div>

        <div class="fog"></div>

        <div class="hint">
            FOLLOW THE STARS • FIND YOUR WAY HOME
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
